<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NA English Messaging Chat</title>
</head>

<body>

<h3>Chat Support NA English</h3>

<script type="text/javascript">
    function initEmbeddedMessaging() {
        try {
            embeddedservice_bootstrap.settings.language = 'en_US';

            embeddedservice_bootstrap.init(
                '00Dbf000005CU2f', // Org Id
                'NA_English_Chat', // Messaging Deployment
                'https://enphase--sbprashant.sandbox.my.site.com/ESWAPACChat1768372599053',
                {
                    scrt2URL: 'https://enphase--sbprashant.sandbox.my.salesforce-scrt.com'
                }
            );
        } catch (err) {
            console.error('Embedded Messaging init error:', err);
        }
    }

    function setHiddenPrechatFields() {
        try {
            embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
                Chat_Source: 'ENHO',
                Persona: 'Homeowner',
                Site_Type: 'Solar'
            });
        } catch (e) {
            console.error('Prechat error:', e);
        }
    }

    window.addEventListener('onEmbeddedMessagingReady', function () {
        setHiddenPrechatFields();
    });
</script>

<script
    type="text/javascript"
    src="https://enphase--sbprashant.sandbox.my.site.com/ESWAPACChat1768372599053/assets/js/bootstrap.min.js"
    onload="initEmbeddedMessaging()">
</script>

</body>
</html>
